
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="Registration.css">
</head>
<body>

    <div class="container">

        <h1>Welcome to Our Sign Up Page</h1>

        <form id="registrationForm" novalidate>

           
            <div class="form-group">
                <label for="name">Full Name:</label>
                <input type="text" id="name" placeholder="Write your name">
                <span class="error" id="nameError"></span>
            </div>

           
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="Write your email">
                <span class="error" id="emailError"></span>
            </div>

            
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" placeholder="Enter your password">
                <span class="error" id="passwordError"></span>
            </div>

           
            <div class="form-group">
                <label>Gender:</label>

                <div class="options">
                    <label>
                        <input type="radio" name="gender" value="Female">
                        Female
                    </label>

                    <label>
                        <input type="radio" name="gender" value="Male">
                        Male
                    </label>

                    <label>
                        <input type="radio" name="gender" value="Other">
                        Other
                    </label>
                </div>

                <span class="error" id="genderError"></span>
            </div>

            
            <div class="form-group">
                <label for="group">Group:</label>

                <select id="group">
                    <option value="">-- Select Group --</option>
                    <option value="Science">Science</option>
                    <option value="Business">Business Studies</option>
                    <option value="Humanities">Humanities</option>
                </select>

                <span class="error" id="groupError"></span>
            </div>

            
            <div class="form-group">
                <label for="hsc">HSC GPA:</label>
                <input type="number" id="hsc" placeholder="Enter HSC GPA"
                       min="0" max="5" step="0.01">
                <span class="error" id="hscError"></span>
            </div>

            
            <div class="form-group">
                <label for="ssc">SSC GPA:</label>
                <input type="number" id="ssc" placeholder="Enter SSC GPA"
                       min="0" max="5" step="0.01">
                <span class="error" id="sscError"></span>
            </div>

            
            <button type="submit">Sign Up</button>

            <a href="login.html" class="back-button">
                Back to Login Page
            </a>

        </form>

    </div>

    <script src="Registration.js"></script>

</body>
</html>
