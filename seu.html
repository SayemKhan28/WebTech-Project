
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>South East University</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">

        <h3>South East University (SEU)</h3>

        <div class="main">

            <div class="information">
                <p>Application Start Date: 2025-11-02</p>
                <p>Application End Date: 2026-02-10</p>
                <p>Exam Date: 2025-12-23</p>
                <p>Result Date: N/P</p>
                <p>Application Fees: 500 Tk</p>

                <p>Faculties:</p>
                <p>Engineering</p>
                <p>Business</p>
                <p>Arts and Social Sciences</p>
            </div>

            <div class="eligibility">

                <h4>Program Details</h4>

                <label for="department">Department:</label>
                <select id="department" onchange="showFees()">
                    <option value="">Select Department</option>
                    <option value="CSE">CSE</option>
                    <option value="EEE">EEE</option>
                    <option value="Architecture">Architecture</option>
                    <option value="BBA">BBA</option>
                    <option value="English">English</option>
                    <option value="Economics">Economics</option>
                    <option value="Pharmacy">Pharmacy</option>
                    <option value="LLB">LLB</option>
                </select>

                <p id="fees">Total Fees:</p>

                <button onclick="apply()">Apply</button>

            </div>

        </div>

        <button class="back" onclick="history.back()">Back</button>

    </div>

    <script src="seu.js"></script>

</body>
</html>
