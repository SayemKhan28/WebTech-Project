
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="forgetpassword.css">
</head>
<body>

    <div class="container">

        <h1>Forgot Password</h1>

        <form id="forgotForm" novalidate>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="Enter your email">
                <span class="error" id="emailError"></span>
            </div>

            <div class="form-group">
                <label for="previousPassword">Previous Password:</label>
                <input type="password" id="previousPassword" placeholder="Enter your previous password">
                <span class="error" id="passwordError"></span>
            </div>

            <button type="submit">Submit</button>

            <a href="login.html" class="back-button">Back to Login</a>

        </form>

    </div>

    <script src="forgetpassword.js"></script>

</body>
</html>
