
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admission Orbit - Private Universities</title>
    <link rel="stylesheet" href="privateDashboard.css">
</head>
<body>

    <div class="container">

        <h1>ADMISSION ORBIT</h1>
        <h3>Private Universities</h3>

        <div class="controls">

            <div class="control">
                <label for="budget">Budget:</label>
                <input type="number" id="budget" placeholder="Enter budget">
                <button onclick="findBudget()">Find</button>
            </div>

            <div class="control">
                <label for="location">Location:</label>
                <select id="location">
                    <option value="">Select Location</option>
                    <option value="Bashundhara">Bashundhara</option>
                    <option value="Mohammadpur">Mohammadpur</option>
                    <option value="Dhanmondi">Dhanmondi</option>
                    <option value="Other">Other</option>
                </select>
                <button onclick="findLocation()">Find</button>
            </div>

            <div class="control">
                <label for="sort">Sort:</label>
                <select id="sort">
                    <option value="">Select Option</option>
                    <option value="ascending">A to Z</option>
                    <option value="descending">Z to A</option>
                </select>
                <button onclick="sortUniversities()">Sort</button>
            </div>

            <div class="control">
                <label for="department">Department:</label>
                <select id="department">
                    <option value="">Select Department</option>
                    <option value="CSE">CSE</option>
                    <option value="EEE">EEE</option>
                    <option value="BBA">BBA</option>
                    <option value="English">English</option>
                    <option value="Architecture">Architecture</option>
                    <option value="Pharmacy">Pharmacy</option>
                    <option value="Economics">Economics</option>
                    <option value="CE">CE</option>
                </select>
                <button onclick="compareUniversities()">Compare</button>
            </div>

        </div>

        <div class="university-container" id="universityList">

            <button onclick="openUniversity('aiub.html')">
                American International University-Bangladesh (AIUB)
            </button>

            <button onclick="openUniversity('brac.html')">
                BRAC University
            </button>

            <button onclick="openUniversity('nsu.html')">
                North South University (NSU)
            </button>

            <button onclick="openUniversity('diu.html')">
                Daffodil International University (DIU)
            </button>

            <button onclick="openUniversity('uiu.html')">
                United International University (UIU)
            </button>

            <button onclick="openUniversity('ewu.html')">
                East West University (EWU)
            </button>

            <button onclick="openUniversity('aust.html')">
                Ahsanullah University of Science and Technology (AUST)
            </button>

            <button onclick="openUniversity('seu.html')">
                South East University (SEU)
            </button>

            <button onclick="openUniversity('iub.html')">
                Independent University Bangladesh (IUB)
            </button>

            <button onclick="openUniversity('nub.html')">
                Northern University Bangladesh (NUB)
            </button>

        </div>

        <button class="next" onclick="nextPage()">Next</button>

    </div>

    <script src="privateDashboard.js"></script>

</body>
</html>
